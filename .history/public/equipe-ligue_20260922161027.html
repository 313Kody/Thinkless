<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipe de ligue - Thinkless</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-gray-950 text-white">
    <nav class="bg-gray-900 border-b border-gray-800 px-6 py-4 flex items-center justify-between">
      <a id="back-link" href="/ligues.html" class="text-xl font-bold text-indigo-400">Thinkless</a>
      <button onclick="logout()" class="text-sm text-red-400 hover:text-red-300">Déconnexion</button>
    </nav>

    <main class="max-w-3xl mx-auto px-4 py-8">
      <a id="return-link" class="text-gray-400 hover:text-white text-sm" href="#">← Retour à la ligue</a>
      <section id="team-card" class="mt-5 bg-gray-900 rounded-2xl border border-gray-800 p-6">
        <div class="flex items-start justify-between gap-4">
          <div>
            <p id="team-poule" class="text-xs uppercase tracking-[0.18em] text-amber-300"></p>
            <h1 id="team-name" class="text-3xl font-black mt-1">Chargement...</h1>
            <p id="team-captain" class="text-gray-400 mt-2"></p>
          </div>
          <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-700 flex items-center justify-center text-2xl font-black" id="team-initial">?</div>
        </div>
      </section>

      <section class="mt-6 bg-gray-900 rounded-2xl border border-gray-800 p-6">
        <h2 class="text-xl font-bold mb-4">Joueurs</h2>
        <div id="players-list" class="grid gap-3"></div>
        <div id="captain-management" class="hidden mt-5 border-t border-gray-800 pt-4">
          <label class="block text-gray-400 text-sm mb-2">Désigner le capitaine</label>
          <div class="flex gap-2">
            <select id="captain-select" class="flex-1 bg-gray-800 text-white rounded-lg px-3 py-2"></select>
            <button onclick="designateCaptain()" class="bg-amber-600 hover:bg-amber-500 text-white font-semibold px-4 py-2 rounded-lg">Désigner</button>
          </div>
        </div>
      </section>

      <section id="requests-section" class="hidden mt-6 bg-gray-900 rounded-2xl border border-amber-800/70 p-6">
        <h2 class="text-xl font-bold mb-4 text-amber-300">Demandes d’adhésion</h2>
        <div id="requests-list" class="grid gap-3"></div>
      </section>
    </main>

    <script>
      const token = localStorage.getItem("token");
      if (!token) window.location.href = "/login.html";
      const params = new URLSearchParams(window.location.search);
      const ligueId = params.get("ligue_id");
      const equipeId = params.get("equipe_id");

      function logout() {
        localStorage.clear();
        window.location.href = "/login.html";
      }

      function escapeHtml(value) {
        return String(value || "").replace(/[&<>'"]/g, (character) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;",
        }[character]));
      }

      async function loadTeam() {
        const res = await fetch(`/api/ligues/${ligueId}/equipes/${equipeId}`, {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Equipe indisponible");

        const team = data.equipe;
        document.getElementById("return-link").href = `/ligue.html?id=${ligueId}`;
        document.getElementById("team-name").textContent = team.nom;
        document.getElementById("team-poule").textContent = `Poule ${team.poule || "-"}`;
        document.getElementById("team-captain").textContent = team.capitaine_pseudo
          ? `Capitaine : ${team.capitaine_pseudo}`
          : "Capitaine à désigner";
        document.getElementById("team-initial").textContent = team.nom.charAt(0).toUpperCase();

        document.getElementById("players-list").innerHTML = data.joueurs.length
          ? data.joueurs.map((player) => `
            <article class="flex items-center justify-between rounded-xl border ${Number(player.est_capitaine) ? "border-amber-500/80 bg-amber-950/20" : "border-gray-800 bg-gray-800/60"} px-4 py-3">
              <div>
                <p class="font-semibold">${escapeHtml(`${player.prenom || ""} ${player.nom || ""}`.trim() || player.pseudo)}</p>
                <p class="text-gray-400 text-sm">@${escapeHtml(player.pseudo)}</p>
              </div>
              ${Number(player.est_capitaine) ? '<span class="text-amber-300 text-xs font-bold uppercase tracking-wide">Capitaine</span>' : '<span class="text-gray-500 text-xs">Joueur</span>'}
            </article>
          `).join("")
          : '<p class="text-gray-500">Aucun joueur accepté dans cette équipe.</p>';

        const captainManagement = document.getElementById("captain-management");
        if (data.can_manage && data.joueurs.length) {
          captainManagement.classList.remove("hidden");
          document.getElementById("captain-select").innerHTML = data.joueurs
            .map((player) => `<option value="${player.id}" ${Number(player.est_capitaine) ? "selected" : ""}>${escapeHtml(player.pseudo)}</option>`)
            .join("");
        } else {
          captainManagement.classList.add("hidden");
        }

        const requestsSection = document.getElementById("requests-section");
        if (data.can_manage) {
          requestsSection.classList.remove("hidden");
          document.getElementById("requests-list").innerHTML = data.demandes.length
            ? data.demandes.map((request) => `
              <div class="flex items-center justify-between gap-3 rounded-xl bg-gray-800 px-4 py-3">
                <span>${escapeHtml(`${request.prenom || ""} ${request.nom || ""}`.trim() || request.pseudo)} <span class="text-gray-400">@${escapeHtml(request.pseudo)}</span></span>
                <div class="flex gap-2">
                  <button onclick="decide(${request.id}, 'accepter')" class="text-emerald-300 text-xs border border-emerald-800 px-3 py-2 rounded-lg">Accepter</button>
                  <button onclick="decide(${request.id}, 'refuser')" class="text-red-300 text-xs border border-red-800 px-3 py-2 rounded-lg">Refuser</button>
                </div>
              </div>
            `).join("")
            : '<p class="text-gray-500">Aucune demande en attente.</p>';
        }
      }

      async function decide(requestId, decision) {
        const res = await fetch(`/api/ligues/${ligueId}/equipes/${equipeId}/demandes/${requestId}/decision`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ decision }),
        });
        const data = await res.json();
        alert(data.message || "Action terminée");
        if (res.ok) loadTeam();
      }

      async function designateCaptain() {
        const utilisateurId = Number(document.getElementById("captain-select").value);
        const res = await fetch(`/api/ligues/${ligueId}/equipes/${equipeId}/capitaine`, {
          method: "PUT",
          headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
          body: JSON.stringify({ utilisateur_id: utilisateurId }),
        });
        const data = await res.json();
        alert(data.message || "Action terminée");
        if (res.ok) await loadTeam();
      }

      if (!ligueId || !equipeId) {
        window.location.href = "/ligues.html";
      } else {
        loadTeam().catch((error) => {
          document.getElementById("team-name").textContent = error.message;
        });
      }
    </script>
  </body>
</html>
